# Puts the TEST copy of Mobile Moallem on Cloudflare. Never touches mobilemoallem.com.
# Runs when the cloudflare-staging branch is pushed. Needs repository secrets
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (added by the owner in GitHub settings).
name: Deploy test copy to Cloudflare
on:
  push:
    branches: [cloudflare-staging]
  workflow_dispatch:
permissions:
  contents: read
concurrency: staging
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check the secrets are set
        run: test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in GitHub > Settings > Secrets and variables > Actions" && exit 1)
      - name: Check what the Cloudflare key can reach
        run: |
          npx --yes wrangler@4.151.2 whoami || true
          echo "--- D1 (database) access:"; npx --yes wrangler@4.151.2 d1 list || echo "NO D1 ACCESS"
          echo "--- R2 (recordings) access:"; npx --yes wrangler@4.151.2 r2 bucket list || echo "NO R2 ACCESS"
      - name: Run the site's tests
        working-directory: application
        run: npm test
      - name: Copy recordings to the test storage (and verify each one)
        run: node migration/upload-r2-staging.mjs mobile-moallem-staging-media
      - name: Put the test site online
        working-directory: application
        run: npx --yes wrangler@4.151.2 deploy -c wrangler.staging.jsonc
